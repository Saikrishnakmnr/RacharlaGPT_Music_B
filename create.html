<body><div class="music-shower" aria-hidden="true"></div><header class="site-header"><a class="brand" href="/">♪ RacharlaGPT Music</a><a href="/">← Home</a></header>
<main class="form-page"><section class="form-shell"><div class="eyebrow">MUSIC STUDIO</div><h1>How would you like to tell us your story?</h1><p>Write it, upload it, or say it.</p>
<div class="input-tabs"><button class="tab active" data-tab="type">✍️ Type it</button><button class="tab" data-tab="upload">📷 Upload it</button><button class="tab" data-tab="voice">🎙️ Say it</button></div>
<form id="songForm"><label>Your name<input required name="customer_name" autocomplete="name"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Occasion<select required name="occasion"><option value="">Choose</option><option>Birthday</option><option>Marriage</option><option>Anniversary</option><option>Party</option><option>Devotional</option><option>Special Moment</option></select></label>
<div class="tab-panel active" id="panel-type"><label>Your requirements<textarea name="description" rows="8" placeholder="Names, memories, wishes, language, mood, lyrics ideas..."></textarea></label></div>
<div class="tab-panel" id="panel-upload"><label>Paper/photo/PDF<input id="paper" type="file" accept="image/*,.pdf"></label><p class="hint">A clear photo or PDF works best.</p></div>
<div class="tab-panel" id="panel-voice"><button type="button" class="btn secondary" id="recordBtn">🎙️ Start Recording</button> <span id="timer">00:00</span><audio id="preview" controls hidden></audio><p class="hint">Record in Telugu, English or mixed language.</p></div>
<label class="check"><input type="checkbox" required> I confirm that my submission is accurate and that I have rights/permission for material I provide.</label>
<button class="btn primary wide" type="submit">Continue to Payment →</button></form><p id="formMsg" class="form-message"></p></section></main><footer>© 2026 RacharlaGPT Music</footer>
