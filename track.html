<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Track Your Song | RacharlaGPT Music</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://songs.racharlagpt.in/track.html">
  <link rel="stylesheet" href="/css/style.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1W86QW7J5Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-1W86QW7J5Y");
  </script>

  <script src="/js/config.js"></script>
</head>

<body>

<div class="music-shower" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="/">♪ RacharlaGPT Music</a>
  <a href="/">Home</a>
</header>

<main class="form-page">
  <section class="form-shell">

    <div class="eyebrow">PRIVATE ORDER</div>

    <h1>Your song journey</h1>

    <p id="state">Checking order…</p>

    <div id="details"></div>

    <div id="messages"></div>

    <a class="btn primary wide" id="songLink" hidden>
      Open Song →
    </a>

    <label>
      Message our production team
      <textarea
        id="message"
        rows="4"
        maxlength="2000"
        placeholder="Ask a question or share a correction…"
      ></textarea>
    </label>

    <button class="btn secondary wide" id="send">
      Send Message
    </button>

    <p id="msg" class="form-message"></p>

  </section>
</main>

<script>

const u = new URL(location.href);
const order = u.searchParams.get("order");
const token = u.searchParams.get("token");

const state = document.getElementById("state");
const details = document.getElementById("details");
const link = document.getElementById("songLink");
const messages = document.getElementById("messages");

function apiBase() {
  return (window.RGM_CONFIG?.PUBLIC_API_BASE || "").replace(/\/$/, "");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function load() {

  try {

    if (!order || !token) {
      throw new Error("Private order link is incomplete.");
    }

    const r = await fetch(
      apiBase() +
      "/orders/" +
      encodeURIComponent(order) +
      "?token=" +
      encodeURIComponent(token)
    );

    const d = await r.json();

    if (!r.ok) {
      throw new Error(d.error || "Order not found");
    }

    state.textContent = String(d.status || "")
      .replaceAll("_", " ");

    details.innerHTML = `
      <p>
        Order <strong>${escapeHtml(d.order_number)}</strong>
        · Payment <strong>${escapeHtml(d.payment_status)}</strong>
      </p>

      <p>
        Occasion: ${escapeHtml(d.occasion)}
        · ₹${Number(d.price || 0).toLocaleString("en-IN")}
      </p>

      <p>
        ${
          d.song_ready
            ? "Your song is ready."
            : "We’ll update this page as your order moves forward."
        }
      </p>
    `;

    messages.innerHTML =
      "<h3>Messages</h3>" +
      (d.messages || [])
        .map(x => `
          <p>
            <b>
              ${
                x.sender_type === "admin"
                  ? "Studio"
                  : "You"
              }
            </b>:
            ${escapeHtml(x.message)}
          </p>
        `)
        .join("");

    if (d.song_ready) {
      link.hidden = false;

      link.href =
        "/song.html?order=" +
        encodeURIComponent(order) +
        "&token=" +
        encodeURIComponent(token);
    }

  } catch (e) {

    state.textContent = e.message;

  }

}

document.getElementById("send").onclick = async () => {

  const body =
    document.getElementById("message").value.trim();

  const msg =
    document.getElementById("msg");

  if (!body) {
    msg.textContent = "Enter a message first.";
    return;
  }

  try {

    const r = await fetch(
      apiBase() +
      "/orders/" +
      encodeURIComponent(order) +
      "/messages",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Access-Token": token
        },
        body: JSON.stringify({ body })
      }
    );

    const d = await r.json();

    if (!r.ok) {
      throw new Error(
        d.error || "Could not send message"
      );
    }

    document.getElementById("message").value = "";

    msg.textContent = "Message sent.";

    await load();

  } catch (e) {

    msg.textContent = e.message;

  }

};

load();

setInterval(load, 15000);

</script>

</body>
</html>
