<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Dashboard | RacharlaGPT Music</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="site-header"><a class="brand" href="/">♪ RacharlaGPT Music</a><button class="btn ghost" id="logout">Sign out</button></header><main class="content-section"><div class="section-inner"><div class="eyebrow">ORDERS</div><h1>Music Studio Dashboard</h1><div id="orders" class="grid"></div></div></main><script src="/js/config.js"></script><script>const api=window.RGM_CONFIG.ADMIN_API_BASE,token=sessionStorage.getItem('rgm_admin_token');if(!token)location.href='/admin/';document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('rgm_admin_token');location.href='/admin/'};async function load(){const r=await fetch(api+'/orders',{headers:{Authorization:'Bearer '+token}});if(r.status===401){location.href='/admin/';return}const d=await r.json();document.getElementById('orders').innerHTML=(d.orders||[]).map(o=>`<a class="tool" href="/admin/order.html?order=${encodeURIComponent(o.order_number)}"><b>${o.order_number}</b><h3>${o.occasion}</h3><p>${o.customer_name} · ${o.payment_status} · ${o.status}</p><strong>Open order →</strong></a>`).join('')||'<p>No orders yet.</p>'}load();</script></body></html>
