<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | RacharlaGPT Music</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="form-page"><section class="form-shell"><div class="eyebrow">PRIVATE ADMIN</div><h1>RacharlaGPT Music Admin</h1><form id="login"><label>Admin access token<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide">Sign in</button></form><p id="msg" class="form-message"></p></section></main><script src="/js/config.js"></script><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');try{const r=await fetch(window.RGM_CONFIG.ADMIN_API_BASE+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');sessionStorage.setItem('rgm_admin_token',d.token);location.href='/admin/dashboard.html'}catch(x){msg.textContent=x.message}};</script></body></html>
