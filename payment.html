der_number,value:o.amount,currency:o.currency});sessionStorage.removeItem('rgm_payment');location.href=o.track_url;},modal:{ondismiss:()=>{m.textContent='Payment window closed. Your order is still saved; you can try payment again from this page.'}}});r.on('payment.failed',e=>{m.textContent=e.error?.description||'Payment failed. Please try again.'});r.open();};}</script></body></html>
