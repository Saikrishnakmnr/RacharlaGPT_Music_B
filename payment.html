<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Payment | RacharlaGPT Music</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/css/style.css"><script async src="https://www.googletagmanager.com/gtag/js?id=G-1W86QW7J5Y"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-1W86QW7J5Y");</script><script src="/js/config.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><div class="music-shower" aria-hidden="true"></div><header class="site-header"><a class="brand" href="/">♪ RacharlaGPT Music</a></header><main class="form-page"><section class="form-shell"><div class="eyebrow">SECURE CHECKOUT</div><h1>Complete your song order</h1><p id="summary">Loading your order…</p><button class="btn primary wide" id="payBtn">Pay Securely →</button><p id="payMsg" class="form-message"></p><div id="trackBox" class="notice" hidden><strong>Track My Song</strong><p>After payment, your song journey will open automatically. You will not need to save a private link.</p></div><p class="hint">Payment is processed by Razorpay. We never store your UPI PIN, card PIN or banking password.</p></section></main><script>
const x=sessionStorage.getItem('rgm_payment');
const o=x?JSON.parse(x):null;
const s=document.getElementById('summary'),b=document.getElementById('payBtn'),m=document.getElementById('payMsg');
const trackBox=document.getElementById('trackBox');
const base=(window.RGM_CONFIG?.PUBLIC_API_BASE||'').replace(/\/$/,'');
if(!o){s.textContent='Your payment session is missing. Please start again.';b.disabled=true;}
else{
  s.innerHTML=`Order <strong>${String(o.order_number).replace(/[<>&"']/g,'')}</strong> · ₹${Number(o.amount||0).toLocaleString('en-IN')}`;
  b.onclick=()=>{
    b.disabled=true;m.textContent='Opening secure payment…';
    if(window.gtag)gtag('event','payment_started',{order_number:o.order_number,value:o.amount,currency:o.currency});
    const r=new Razorpay({
      key:o.razorpay.key_id,amount:Math.round(o.amount*100),currency:o.currency,order_id:o.razorpay.order_id,
      name:'RacharlaGPT Music',description:'Personalized song order',
      handler:async function(resp){
        try{
          m.textContent='Payment received. Verifying securely…';
          const vr=await fetch(base+'/orders/'+encodeURIComponent(o.order_number)+'/payment/verify',{
            method:'POST',
            headers:{'Content-Type':'application/json','X-Access-Token':o.access_token},
            body:JSON.stringify(resp)
          });
          const vd=await vr.json();
          if(!vr.ok)throw Error(vd.error||'Payment verification is still pending');
          localStorage.setItem('rgm_customer_session',JSON.stringify({
            order_number:o.order_number,
            access_token:o.access_token,
            saved_at:new Date().toISOString()
          }));
          sessionStorage.removeItem('rgm_payment');
          trackBox.hidden=false;
          if(window.gtag)gtag('event','payment_success',{order_number:o.order_number,value:o.amount,currency:o.currency});
          location.href='/track.html';
        }catch(e){
          m.textContent=e.message+' Your order is saved. Please try payment verification again.';
          b.disabled=false;
        }
      },
      modal:{ondismiss:()=>{m.textContent='Payment window closed. Your order is still saved; you can try again.';b.disabled=false;}}
    });
    r.on('payment.failed',e=>{m.textContent=e.error?.description||'Payment failed. Please try again.';b.disabled=false;});
    r.open();
  };
}
</script></body></html>
